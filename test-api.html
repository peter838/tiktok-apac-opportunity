<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
</head>
<body>
  <h1>API Test</h1>
  <div id="status">Testing...</div>
  <div id="result"></div>

  <script src="sa-api-client.js"></script>
  <script>
    async function test() {
      try {
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');

        statusEl.textContent = 'Fetching data...';
        
        // entity-margin endpoint removed
        resultEl.innerHTML = '<p>⚠️ entity-margin endpoint removed from dashboard</p>';
        
        statusEl.textContent = 'Done';
      } catch (error) {
        document.getElementById('status').textContent = 'Error: ' + error.message;
        console.error(error);
      }
    }

    test();
  </script>
</body>
</html>
